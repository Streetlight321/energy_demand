name: Energy pipeline

on:
  schedule:
    # 15 minutes past every hour (UTC), after the EIA publishes the hour.
    - cron: "15 * * * *"
  workflow_dispatch:

# Never let a slow run overlap the next scheduled one.
concurrency:
  group: energy-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run energy pipeline
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: uv run pipeline.py
