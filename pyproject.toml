[project]
name = "energy-demand"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yousef Eddin", email = "yousef.eddin123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
energy-demand = "energy_demand:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
